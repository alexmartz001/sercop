<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Radar de Oportunidades SERCOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA; --panel:#FFFFFF; --border:#D7DEE5; --text:#101820; --muted:#5B6B7A;
    --accent:#0C8C82; --accent-dim:#BFE8E1; --red:#DC2626;
    --mono:'IBM Plex Mono', monospace; --sans:'Inter', sans-serif; --display:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, #E7F4F2 0%, var(--bg) 60%);
    color:var(--text); font-family:var(--sans); font-size:14px; padding:24px;}
  .card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 18px 50px rgba(16,24,32,.10); padding:28px 26px 24px; position:relative; overflow:hidden;}
  .card::before{content:''; position:absolute; left:0; right:0; top:0; height:3px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);}
  .brand{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .mark{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent);
    border:1px solid var(--accent-dim); padding:3px 7px; border-radius:3px; background:rgba(12,140,130,.08);}
  h1{font-family:var(--display); font-size:19px; margin:0; font-weight:600;}
  .sub{font-family:var(--mono); font-size:11px; color:var(--muted); margin:2px 0 22px;}
  label{display:block; font-size:12px; font-weight:600; margin:14px 0 6px; color:var(--muted);}
  input{width:100%; height:40px; padding:0 12px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--text); font-size:14px; font-family:var(--sans); outline:none;}
  input:focus{border-color:var(--accent); background:#fff;}
  button{width:100%; height:42px; margin-top:20px; border:none; border-radius:6px; cursor:pointer;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600; font-family:var(--sans);}
  button:hover{filter:brightness(1.05);}
  button:disabled{opacity:.55; cursor:default;}
  .msg{margin-top:14px; padding:10px 12px; border-radius:6px; font-size:12.5px; display:none;}
  .msg.error{display:block; background:#FEF2F2; color:var(--red); border:1px solid #FECACA;}
  .msg.info{display:block; background:#ECFDF5; color:#047857; border:1px solid #A7F3D0;}
  .foot{margin-top:20px; font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center; line-height:1.7;}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">
      <span class="mark">NVG</span>
      <div>
        <h1>Radar de Oportunidades</h1>
        <div class="sub">Acceso restringido · SERCOP Ecuador</div>
      </div>
    </div>

    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit" id="btnLogin">Ingresar</button>
    <div class="msg" id="msg"></div>
    <div class="foot">
      Sesión protegida · cookie HttpOnly + SameSite<br>
      No compartas tus credenciales.
    </div>
  </form>

<script>
(function(){
  'use strict';
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnLogin');
  const params = new URLSearchParams(location.search);

  function show(kind, text){ msg.className = 'msg ' + kind; msg.textContent = text; }

  if(params.get('expired')) show('info', 'Tu sesión expiró. Vuelve a ingresar.');
  if(params.get('logout')) show('info', 'Sesión cerrada correctamente.');

  // Si ya hay una sesión válida, pasa directo al panel.
  fetch('/api/auth/session', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(s => { if(s && s.authenticated) location.replace('/'); })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if(!username || !password){ show('error', 'Ingresa usuario y contraseña.'); return; }
    btn.disabled = true; btn.textContent = 'Verificando…'; msg.className = 'msg';
    try{
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json().catch(() => ({}));
      if(resp.ok && data.ok){
        btn.textContent = 'Entrando…';
        location.replace('/');
        return;
      }
      if(resp.status === 429){
        const secs = Math.ceil((data.retryAfterMs || 0) / 1000) || 60;
        show('error', `Demasiados intentos. Espera ${secs >= 60 ? Math.ceil(secs/60) + ' min' : secs + ' s'} e inténtalo de nuevo.`);
      } else {
        show('error', data.error || 'Usuario o contraseña incorrectos.');
      }
    }catch(err){
      show('error', 'No se pudo contactar el servidor.');
    }finally{
      btn.disabled = false;
      if(btn.textContent !== 'Entrando…') btn.textContent = 'Ingresar';
      document.getElementById('password').value = '';
    }
  });
})();
</script>
</body>
</html>
